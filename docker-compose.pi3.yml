# MediaHub - Raspberry Pi 3 Limited Mode
# Optimized for 1GB RAM devices
# Essential services only - no resource-intensive apps

services:
  # ============================================
  # VPN Protection (Required)
  # ============================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-protonvpn}
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Netherlands}
      - SERVER_REGIONS=${SERVER_REGIONS:-}
      - SERVER_CITIES=${SERVER_CITIES:-}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${CONFIG_PATH:-./config}/gluetun:/gluetun
    ports:
      # qBittorrent Web UI
      - "8080:8080"
      # Sonarr
      - "8989:8989"
      # Radarr
      - "7878:7878"
      # Prowlarr
      - "9696:9696"
      # Bazarr
      - "6767:6767"
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5

  # ============================================
  # Media Server (Direct Play Only)
  # ============================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      # Disable transcoding for Pi3
      - JELLYFIN_FFmpeg__hardwareAcceleration=none
    volumes:
      - ${CONFIG_PATH:-./config}/jellyfin:/config
      - ${MEDIA_PATH:-/mnt/media}/library:/data/media
      - ${MEDIA_PATH:-/mnt/media}/library/movies:/data/movies
      - ${MEDIA_PATH:-/mnt/media}/library/tv:/data/tvshows
    ports:
      - "8096:8096"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  # ============================================
  # Download Client (VPN Protected)
  # ============================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_PATH:-./config}/qbittorrent:/config
      - ${DOWNLOAD_PATH:-/mnt/media/downloads}:/downloads
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # ============================================
  # Media Management (VPN Protected)
  # ============================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${CONFIG_PATH:-./config}/sonarr:/config
      - ${MEDIA_PATH:-/mnt/media}/library/tv:/tv
      - ${DOWNLOAD_PATH:-/mnt/media/downloads}:/downloads
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${CONFIG_PATH:-./config}/radarr:/config
      - ${MEDIA_PATH:-/mnt/media}/library/movies:/movies
      - ${DOWNLOAD_PATH:-/mnt/media/downloads}:/downloads
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # ============================================
  # Indexer Manager (VPN Protected)
  # ============================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${CONFIG_PATH:-./config}/prowlarr:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.3

  # ============================================
  # Subtitles (VPN Protected)
  # ============================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - sonarr
      - radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${CONFIG_PATH:-./config}/bazarr:/config
      - ${MEDIA_PATH:-/mnt/media}/library/movies:/movies
      - ${MEDIA_PATH:-/mnt/media}/library/tv:/tv
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.3

  # ============================================
  # Dashboard (Lightweight)
  # ============================================
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${CONFIG_PATH:-./config}/homarr:/app/data/configs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "7575:7575"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.3

  # ============================================
  # Welcome Service (First-time setup)
  # ============================================
  welcome:
    image: nginx:alpine
    container_name: mediahub-welcome
    volumes:
      - ${CONFIG_PATH:-./config}/welcome:/usr/share/nginx/html:ro
    ports:
      - "8888:80"
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1

# ============================================
# Networks
# ============================================
networks:
  default:
    name: mediahub-pi3
    driver: bridge

# ============================================
# Notes for Raspberry Pi 3:
# ============================================
# Total RAM usage: ~900MB (leaving 100MB for OS)
#
# Services included (8):
# - gluetun (VPN)
# - jellyfin (Media Server - Direct Play only)
# - qbittorrent (Downloads)
# - sonarr (TV Series)
# - radarr (Movies)
# - prowlarr (Indexers)
# - bazarr (Subtitles)
# - homarr (Dashboard)
#
# Services excluded:
# - PhotoPrism (too heavy)
# - Komga (comics)
# - Navidrome (music)
# - Grafana/Prometheus (monitoring)
# - Netdata (monitoring)
# - Audiobookshelf
# - FlareSolverr (JS bypass)
# - Lidarr (music)
# - Readarr (books)
# - Overseerr (requests)
# - Tautulli (stats)
# - Watchtower (auto-update)
# - Portainer (Docker GUI)
#
# Recommendations:
# 1. Use external HDD for media
# 2. Set swap to 1GB
# 3. Use wired ethernet
# 4. Avoid transcoding in Jellyfin
# 5. Limit concurrent downloads to 2
