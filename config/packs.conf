# MediaHub Installation Packs Configuration
# This file defines which services are included in each pack

# MINIMAL PACK - Basic media streaming (7 services)
# Perfect for low-resource systems or simple setups
PACK_MINIMAL="gluetun qbittorrent prowlarr flaresolverr sonarr radarr jellyfin"

# ESSENTIAL PACK - Core functionality with management (15 services)
# Good balance of features and resource usage
PACK_ESSENTIAL="gluetun qbittorrent prowlarr flaresolverr sonarr radarr lidarr bazarr jellyfin jellyseerr heimdall portainer watchtower unpackerr recyclarr"

# FULL PACK - Complete media hub with all features (30+ services)
# All available services for maximum functionality
PACK_FULL="gluetun qbittorrent prowlarr flaresolverr sonarr radarr lidarr bazarr jellyfin jellyseerr heimdall homarr portainer watchtower unpackerr recyclarr navidrome komga photoprism mylar3 ersatztv netdata uptime-kuma scrutiny tautulli duplicati pihole nginx-proxy-manager wireguard gotify apprise-api ntfy tv-admin"

# DEV PACK - Development tools (addons, can be combined with other packs)
# These are optional developer tools
PACK_DEV="code-server portainer"

